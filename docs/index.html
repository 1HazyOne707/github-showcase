<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>GitHub Showcase Dashboard</title>
</head>

<body>
  <h1>GitHub Showcase Dashboard</h1>

  <p>Live status view of repository automation.</p>

  <h2>System Status</h2>
  <ul>
    <li id="status">Loading repo status...</li>
  </ul>

  <h2>Latest Commit</h2>
  <p id="commit">Loading commit...</p>

  <h2>Last Update</h2>
  <p id="updated">Loading timestamp...</p>

  <h2>Quick Links</h2>
  <ul>
    <li><a href="https://github.com/1HazyOne707/github-showcase/actions">Actions</a></li>
    <li><a href="https://github.com/1HazyOne707/github-showcase/pulls">Pull Requests</a></li>
    <li><a href="https://github.com/1HazyOne707/github-showcase/issues">Issues</a></li>
    <li><a href="https://github.com/1HazyOne707/github-showcase">Repository</a></li>
  </ul>

  <script>
    async function loadGitHubData() {
      const repo = "1HazyOne707/github-showcase";

      try {
        const repoRes = await fetch(`https://api.github.com/repos/${repo}`);
        const repoData = await repoRes.json();

        const commitRes = await fetch(`https://api.github.com/repos/${repo}/commits`);
        const commits = await commitRes.json();

        document.getElementById("status").innerText =
          repoData.full_name + " | ⭐ " + repoData.stargazers_count;

        document.getElementById("commit").innerText =
          commits[0].commit.message;

        document.getElementById("updated").innerText =
          commits[0].commit.author.date;

      } catch (e) {
        document.getElementById("status").innerText = "Error loading GitHub data";
        console.error(e);
      }
    }

    loadGitHubData();
  </script>

</body>
</html>
