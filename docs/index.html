<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>GitHub Showcase Dashboard</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }

    svg {
      border: 1px solid #ddd;
      width: 100%;
      height: 500px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
    }
  </style>
</head>

<body>

<h1>System Dashboard</h1>

<h2>GitHub Status</h2>
<ul>
  <li id="status">Loading...</li>
  <li id="ci">CI loading...</li>
  <li id="prs">PRs loading...</li>
  <li id="issues">Issues loading...</li>
</ul>

<h2>Project Intelligence</h2>
<div id="project-cards" class="cards"></div>

<h2>Ontology Graph</h2>
<svg id="graph"></svg>

<script>
const repo = "1HazyOne707/github-showcase";

/* ---------------- GitHub Stats ---------------- */
async function loadGitHub() {
  const repoData = await fetch(`https://api.github.com/repos/${repo}`).then(r => r.json());
  const prs = await fetch(`https://api.github.com/repos/${repo}/pulls?state=open`).then(r => r.json());
  const issues = await fetch(`https://api.github.com/repos/${repo}/issues?state=open`).then(r => r.json());
  const runs = await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=1`).then(r => r.json());

  const intelligence = {
    repo: repoData,
    prs,
    issues,
    ci: runs.workflow_runs?.[0] || null
  };

  document.getElementById("status").innerText =
    repoData.full_name + " ⭐ " + repoData.stargazers_count;

  document.getElementById("prs").innerText = "PRs: " + prs.length;
  document.getElementById("issues").innerText = "Issues: " + issues.length;

  document.getElementById("ci").innerText =
    intelligence.ci
      ? "CI: " + intelligence.ci.conclusion
      : "CI: none";

  return intelligence;
}


/* ---------------- Project Intelligence Cards ---------------- */
async function loadProjectIntelligence(github) {
  const data = await fetch("./data/github-showcase.json").then(r => r.json());

  const project = data.project;
  const modules = data.modules || [];
  const relationships = data.relationships || [];

  const repo = github?.repo || {};
  const ci = github?.ci;

  document.getElementById("project-cards").innerHTML = `
    <div class="card">
      <h3>${project.name}</h3>
      <p>Modules: ${modules.length}</p>
      <p>Relationships: ${relationships.length}</p>
    </div>

    <div class="card">
      <h3>Repository</h3>
      <p>⭐ Stars: ${repo.stargazers_count || 0}</p>
      <p>🍴 Forks: ${repo.forks_count || 0}</p>
      <p>Updated: ${repo.updated_at ? new Date(repo.updated_at).toLocaleDateString() : "unknown"}</p>
    </div>

    <div class="card">
      <h3>Engineering</h3>
      <p>Open PRs: ${github?.prs?.length || 0}</p>
      <p>Open Issues: ${github?.issues?.length || 0}</p>
      <p>CI: ${ci?.conclusion || "unknown"}</p>
    </div>

    ${modules.map(m => `
      <div class="card">
        <h3>${m.name}</h3>
        <p>Type: ${m.type}</p>
      </div>
    `).join("")}
  `;
}


/* ---------------- Ontology Graph ---------------- */
async function loadGraph() {
  const data = await fetch("./data/github-showcase.json").then(r => r.json());

  const nodes = {};

  nodes[data.project.id] = {
    id: data.project.id
  };

  data.modules.forEach(m => {
    nodes[m.id] = {
      id: m.id
    };
  });

  const nodeList = Object.values(nodes);

  const links = data.relationships.map(rel => ({
    source: rel.from,
    target: rel.to,
    type: rel.type
  }));

  const svg = d3.select("#graph");
  const width = 900;
  const height = 500;

  const simulation = d3.forceSimulation(nodeList)
    .force("link", d3.forceLink(links).id(d => d.id).distance(120))
    .force("charge", d3.forceManyBody().strength(-300))
    .force("center", d3.forceCenter(width/2, height/2));

  const link = svg.append("g")
    .selectAll("line")
    .data(links)
    .enter()
    .append("line")
    .attr("stroke", "#aaa");

  const node = svg.append("g")
    .selectAll("circle")
    .data(nodeList)
    .enter()
    .append("circle")
    .attr("r", 10)
    .attr("fill", "steelblue");

  const label = svg.append("g")
    .selectAll("text")
    .data(nodeList)
    .enter()
    .append("text")
    .text(d => d.id)
    .attr("font-size", 12);

  simulation.on("tick", () => {
    link
      .attr("x1", d => d.source.x)
      .attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x)
      .attr("y2", d => d.target.y);

    node
      .attr("cx", d => d.x)
      .attr("cy", d => d.y);

    label
      .attr("x", d => d.x + 12)
      .attr("y", d => d.y + 4);
  });
}


loadGitHub().then(loadProjectIntelligence);
loadGraph();

</script>

</body>
</html>
