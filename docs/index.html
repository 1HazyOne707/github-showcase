<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>GitHub Showcase Dashboard</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: sans-serif; }
    svg { border: 1px solid #ddd; width: 100%; height: 500px; }
  </style>
</head>

<body>
<h1>System Dashboard</h1>

<h2>GitHub Status</h2>
<ul>
  <li id="status">Loading...</li>
  <li id="ci">CI loading...</li>
  <li id="prs">PRs loading...</li>
  <li id="issues">Issues loading...</li>
</ul>

<h2>Ontology Graph</h2>
<svg id="graph"></svg>

<script>
const repo = "1HazyOne707/github-showcase";

/* ---------------- GitHub Stats ---------------- */
async function loadGitHub() {
  const repoData = await fetch(`https://api.github.com/repos/${repo}`).then(r => r.json());
  const prs = await fetch(`https://api.github.com/repos/${repo}/pulls?state=open`).then(r => r.json());
  const issues = await fetch(`https://api.github.com/repos/${repo}/issues?state=open`).then(r => r.json());
  const runs = await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=1`).then(r => r.json());

  document.getElementById("status").innerText =
    repoData.full_name + " ⭐ " + repoData.stargazers_count;

  document.getElementById("prs").innerText = "PRs: " + prs.length;
  document.getElementById("issues").innerText = "Issues: " + issues.length;

  document.getElementById("ci").innerText =
    runs.workflow_runs?.[0]
      ? "CI: " + runs.workflow_runs[0].conclusion
      : "CI: none";
}

/* ---------------- Ontology Graph ---------------- */
async function loadGraph() {
  const data = await fetch("./data/ontology.json").then(r => r.json());

  const nodes = Object.keys(data.nodes).map(n => ({ id: n }));
  const links = data.relationships.map(rel => ({
    source: rel.from,
    target: rel.to,
    type: rel.type
  }));

  const svg = d3.select("#graph");
  const width = 900;
  const height = 500;

  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(120))
    .force("charge", d3.forceManyBody().strength(-300))
    .force("center", d3.forceCenter(width/2, height/2));

  const link = svg.append("g")
    .selectAll("line")
    .data(links)
    .enter().append("line")
    .attr("stroke", "#aaa");

  const node = svg.append("g")
    .selectAll("circle")
    .data(nodes)
    .enter().append("circle")
    .attr("r", 10)
    .attr("fill", "steelblue");

  const label = svg.append("g")
    .selectAll("text")
    .data(nodes)
    .enter().append("text")
    .text(d => d.id)
    .attr("font-size", 12);

  simulation.on("tick", () => {
    link
      .attr("x1", d => d.source.x)
      .attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x)
      .attr("y2", d => d.target.y);

    node
      .attr("cx", d => d.x)
      .attr("cy", d => d.y);

    label
      .attr("x", d => d.x + 12)
      .attr("y", d => d.y + 4);
  });
}

loadGitHub();
loadGraph();
</script>

</body>
</html>
