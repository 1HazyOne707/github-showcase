name: Ontology Validation

on:
  push:
    paths:
      - "ontology/**"
  pull_request:
    paths:
      - "ontology/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate ontology
        run: python scripts/validate_ontology.py
