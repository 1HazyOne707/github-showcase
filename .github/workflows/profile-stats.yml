name: Update Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  profile-stats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install gh
        run: type -p gh || (sudo apt update && sudo apt install -y gh)

      - name: Run updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_profile_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "chore: update profile stats [skip ci]" && git push)
