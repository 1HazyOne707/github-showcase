name: Update Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  profile-stats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run updater
        run: python scripts/update_profile_stats.py
